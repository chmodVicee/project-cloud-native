AWSTemplateFormatVersion: 2010-09-09
Description: Pedidos360 en AWS - ECS Fargate (1 task, 6 contenedores), ALB, API Gateway HTTP como punto de control unico

Parameters:
  EnvironmentName:
    Type: String
    Default: pedidos360
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
  DbUser:
    Type: String
    Default: postgres
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 64
    Description: Clave hexadecimal de 64 bytes compartida por bff y users (JSON web signature HS512)
  JwtExpiration:
    Type: Number
    Default: 86400000
  AzureClientId:
    Type: String
  AzureClientSecret:
    Type: String
    NoEcho: true
  AzureTenantId:
    Type: String
  AzureAdminDomain:
    Type: String
    Default: duocuc.cl
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""

Resources:
  # ------------------------------------------------------------------ VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ------------------------------------------------------------- Seguridad
  LoadBalancerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso HTTP al ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TaskSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Trafico hacia el task de Fargate (ALB a puertos 80 y 8080)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSG
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSG
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ------------------------------------------------------------------ ALB
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref LoadBalancerSG]

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-spa-tg'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckPort: 80
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  BffTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-bff-tg'
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /oauth2/authorization/azure
      HealthCheckProtocol: HTTP
      HealthCheckPort: 8080
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "302"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  ApiToBffRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
            - /oauth2/*
            - /login/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BffTargetGroup

  # --------------------------------------------------------------- Logs
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}'
      RetentionInDays: 7

  # ----------------------------------------------------------------- ECS
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref EnvironmentName
      CapacityProviders: [FARGATE]

  # El entorno de practica (voclabs) no permite crear roles IAM, se reutiliza
  # el rol existente "LabRole" (confia en ecs-tasks.amazonaws.com y trae
  # AmazonEC2ContainerRegistryReadOnly) como execution y task role.
  Pedidos360TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-pedidos360'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "2048"
      Memory: "4096"
      ExecutionRoleArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      TaskRoleArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      ContainerDefinitions:
        - Name: db
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pedidos360-db:latest'
          Essential: true
          Environment:
            - Name: POSTGRES_DB
              Value: users_db
            - Name: POSTGRES_USER
              Value: !Ref DbUser
            - Name: POSTGRES_PASSWORD
              Value: !Ref DbPassword
          PortMappings:
            - ContainerPort: 5432
          HealthCheck:
            Command: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            Interval: 5
            Timeout: 3
            Retries: 10
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: db

        - Name: users
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pedidos360-users:latest'
          Essential: true
          DependsOn:
            - ContainerName: db
              Condition: HEALTHY
          Environment:
            - Name: DB_HOST
              Value: localhost
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: users_db
            - Name: DB_USER
              Value: !Ref DbUser
            - Name: DB_PASSWORD
              Value: !Ref DbPassword
            - Name: JWT_SECRET
              Value: !Ref JwtSecret
            - Name: JWT_EXPIRATION
              Value: !Ref JwtExpiration
            - Name: AZURE_CLIENT_ID
              Value: !Ref AzureClientId
            - Name: AZURE_CLIENT_SECRET
              Value: !Ref AzureClientSecret
            - Name: AZURE_TENANT_ID
              Value: !Ref AzureTenantId
            - Name: AZURE_REDIRECT_URI
              Value: !Sub '${Api.ApiEndpoint}/login/oauth2/code/azure'
            - Name: AZURE_ADMIN_DOMAIN
              Value: !Ref AzureAdminDomain
            - Name: GOOGLE_CLIENT_ID
              Value: !Ref GoogleClientId
            - Name: GOOGLE_CLIENT_SECRET
              Value: !Ref GoogleClientSecret
            - Name: GOOGLE_REDIRECT_URI
              Value: !Sub '${Api.ApiEndpoint}/login/oauth2/code/google'
            - Name: SPA_BASE_URL
              Value: !Sub '${Api.ApiEndpoint}'
            - Name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK
              Value: DEBUG
          PortMappings:
            - ContainerPort: 8083
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: users

        - Name: catalog
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pedidos360-catalog:latest'
          Essential: true
          DependsOn:
            - ContainerName: db
              Condition: HEALTHY
          Environment:
            - Name: DB_HOST
              Value: localhost
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: catalog_db
            - Name: DB_USER
              Value: !Ref DbUser
            - Name: DB_PASSWORD
              Value: !Ref DbPassword
          PortMappings:
            - ContainerPort: 8081
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: catalog

        - Name: orders
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pedidos360-orders:latest'
          Essential: true
          DependsOn:
            - ContainerName: db
              Condition: HEALTHY
          Environment:
            - Name: DB_HOST
              Value: localhost
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: orders_db
            - Name: DB_USER
              Value: !Ref DbUser
            - Name: DB_PASSWORD
              Value: !Ref DbPassword
            - Name: CATALOG_URL
              Value: http://localhost:8081
          PortMappings:
            - ContainerPort: 8082
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: orders

        - Name: bff
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pedidos360-bff:latest'
          Essential: true
          Environment:
            - Name: USERS_URL
              Value: http://localhost:8083
            - Name: CATALOG_URL
              Value: http://localhost:8081
            - Name: ORDERS_URL
              Value: http://localhost:8082
            - Name: BFF_PUBLIC_BASE
              Value: !Sub '${Api.ApiEndpoint}'
            - Name: JWT_SECRET
              Value: !Ref JwtSecret
            - Name: CORS_ALLOWED_ORIGIN
              Value: !Sub '${Api.ApiEndpoint}'
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bff

        - Name: frontend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pedidos360-frontend:latest'
          Essential: true
          Environment:
            - Name: VITE_API_URL
              Value: ''
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - ApiToBffRule
    Properties:
      Cluster: !Ref EcsCluster
      ServiceName: !Sub '${EnvironmentName}-svc'
      TaskDefinition: !Ref Pedidos360TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref TaskSG]
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
        - ContainerName: bff
          ContainerPort: 8080
          TargetGroupArn: !Ref BffTargetGroup

  # ------------------------------------------------------- API Gateway
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${EnvironmentName}-api'
      Description: API Gateway HTTP que controla Pedidos360 (SPA + API bajo un mismo origen)
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      Description: Proxy HTTP al ALB (SPA y BFF segun path)
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub 'http://${LoadBalancer.DNSName}'
      PayloadFormatVersion: "1.0"

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ApiIntegration
    Properties:
      ApiId: !Ref Api
      RouteKey: "$default"
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: ApiRoute
    Properties:
      ApiId: !Ref Api
      StageName: "$default"
      AutoDeploy: true
      Description: Stage por defecto (URL de invocacion sin sufijo)

Outputs:
  ApiGatewayUrl:
    Description: URL del API Gateway (controla todo el sistema, SPA + API)
    Value: !GetAtt Api.ApiEndpoint
  AzureRedirectUri:
    Description: URI de redireccion a registrar en Microsoft Entra
    Value: !Sub '${Api.ApiEndpoint}/login/oauth2/code/azure'
  GoogleRedirectUri:
    Description: URI de redireccion a registrar en Google Cloud Console
    Value: !Sub '${Api.ApiEndpoint}/login/oauth2/code/google'
  LoadBalancerDns:
    Description: DNS del balanceador (acceso directo de diagnostico)
    Value: !GetAtt LoadBalancer.DNSName