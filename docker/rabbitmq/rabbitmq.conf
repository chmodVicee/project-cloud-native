# ---------------------------------------------------------------------------
# Configuracion comun de los 3 nodos del cluster RabbitMQ.
# El docker-compose la monta en /etc/rabbitmq/conf.d/90-cluster.conf, que la
# imagen oficial carga despues de su /etc/rabbitmq/rabbitmq.conf.
# ---------------------------------------------------------------------------

# Descubrimiento de pares por lista estatica: cada nodo intenta unirse al
# primer nodo de la lista que este disponible. El primero en arrancar crea el
# cluster y los demas se unen a el (el propio nodo se ignora en la lista).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Tipo de cola por defecto: quorum (replicada en la mayoria del cluster).
# Sin esto las colas serian "classic" y no sobrevivirian a la caida de un
# nodo. Aplica a las colas que declara la aplicacion y a las que crea
# ms-pedidos360-rabbit-admin por API.
default_queue_type = quorum

# Ante una particion de red, los nodos en minoria se pausan en vez de aceptar
# escrituras que despues se perderian (recomendado con colas quorum).
cluster_partition_handling = pause_minority
