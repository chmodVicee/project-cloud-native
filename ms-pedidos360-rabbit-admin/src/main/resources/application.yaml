server:
  port: ${PORT:8084}

spring:
  rabbitmq:
    # Nodos del cluster separados por coma: Spring AMQP usa el primero
    # disponible y pasa al siguiente si un nodo cae.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD}

# Reglas del administrador (ver RabbitAdminProperties)
rabbit-admin:
  # Prefijos que la API no permite crear ni eliminar: los reservados de RabbitMQ (amq.)
  # y los que declara el sistema Pedidos360 desde sus microservicios.
  protected-prefixes:
    - amq.
    - pedidos360.
    - orders.
